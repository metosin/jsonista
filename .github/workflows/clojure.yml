name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-clj:
    strategy:
      matrix:
        jdk: [17, 21, 25, 26]

    name: Clojure (Java ${{ matrix.jdk }})

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-clj-${{ hashFiles('project.clj') }}
        restore-keys: |
          ${{ runner.os }}-clj-
    - name: Setup Java ${{ matrix.jdk }}
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: ${{ matrix.jdk }}
    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        # 2.13.x tags on the GitHub mirror have a stale bin/lein (2.12.1-SNAPSHOT)
        lein: 2.12.0
    - name: Run tests
      run: lein do clean, all test, all check

  lint:
    name: clj-kondo

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup clj-kondo
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        clj-kondo: 2026.10.26
    - name: Lint
      run: clj-kondo --lint src test
